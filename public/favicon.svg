<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 2000 2000" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Logo mark</title>
  <style>
    .m { fill: #0B1220; }
    .a { fill: #3B5BFF; }
    @media (prefers-color-scheme: dark) { .m { fill: #FFFFFF; } .a { fill: #7C93FF; } }
  </style>
  <defs>
    <clipPath id="disc"><circle cx="1000" cy="1000" r="900"/></clipPath>
  </defs>
  <g clip-path="url(#disc)">
    <rect class="m" x="40"  y="40"   width="1080" height="880"  rx="70"/>
    <rect class="m" x="1200" y="40"  width="760"  height="1080" rx="70"/>
    <rect class="m" x="880" y="1200" width="1080" height="760"  rx="70"/>
    <rect class="m" x="40"  y="1000" width="760"  height="960" rx="70"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
